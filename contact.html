    <section id="about-me" class="about-me">
        <div class="contact-container">
            <div class="contact-form">
                <h2>Get in Touch</h2>
                <form action="https://formspree.io/f/xzdjzbop" method="POST">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" placeholder="How can I help you?" required></textarea>

                    <input type="text" name="_gotcha" style="display:none">

                    <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>

                    <button type="submit">SEND MESSAGE</button>
                </form>
                <script src="https://www.google.com/recaptcha/api.js" async defer></script>
            </div>

            <div class="contact-details">
                <h2>Contact Details</h2>
                <p><strong>Email:</strong> <a href="mailto:simi-chavda@hotmail.co.uk" style="color: inherit; text-decoration: none;">simi-chavda@hotmail.co.uk</a></p>
                <p><strong>Location:</strong> Buckinghamshire, England</p>
                <ul class="social-links">
                    <li>
                        <a href="https://www.linkedin.com/in/simi-chavda-56b835235/" target="_blank">LinkedIn</a> |
                        <a href="https://github.com/your-username" target="_blank">GitHub</a>
                    </li>
                </ul>
            </div>
        </div>
